name: Deploy ticketing service

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-ticketing.yml'
      - '.github/workflows/deploy-service.yml'
      - 'microservices/ticketing-service/**'
      - 'packages/shared/**'
      - 'contracts/proto/flightplatform/common/**'
      - 'contracts/proto/flightplatform/ticketing/**'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ticketing.yml'
      - '.github/workflows/deploy-service.yml'
      - 'microservices/ticketing-service/**'
      - 'packages/shared/**'
      - 'contracts/proto/flightplatform/common/**'
      - 'contracts/proto/flightplatform/ticketing/**'
      - 'package-lock.json'
      - 'tsconfig.base.json'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: microservices/ticketing-service
      dockerfile: microservices/ticketing-service/Dockerfile
      image: us-east1-docker.pkg.dev/project-a1d2e3ba-f6ff-469e-854/flight-platform/ticketing-service:${{ github.sha }}
      cloud_run_service: ticketing-service
      project_id: project-a1d2e3ba-f6ff-469e-854
      region: us-east1
      runtime_service_account: ticketing-service-runtime@project-a1d2e3ba-f6ff-469e-854.iam.gserviceaccount.com
      secret_name: internal-api-key
      extra_secrets: DATABASE_URL=ticketing-database-url:latest
      test_command: npx jest microservices/ticketing-service/test/unit --runInBand
    secrets:
      workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
      service_account: ${{ secrets.GCP_DEPLOY_SA }}
