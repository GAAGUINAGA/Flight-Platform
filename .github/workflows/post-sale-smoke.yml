name: Post-sale smoke
on:
  workflow_dispatch:
    inputs:
      reservation_target:
        description: Reservation gRPC target, such as reservation-service-xyz.a.run.app:443
        required: true
        type: string
      pricing_target:
        description: Pricing gRPC target, such as pricing-service-xyz.a.run.app:443
        required: true
        type: string
      insecure:
        description: Use plaintext gRPC for local targets
        required: false
        default: false
        type: boolean
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - name: Exercise baggage, date change and cancellation
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PRICING_GRPC_URL: ${{ inputs.pricing_target }}
          RESERVATION_TARGET: ${{ inputs.reservation_target }}
          GRPC_INSECURE: ${{ inputs.insecure }}
        run: |
          if [ "$GRPC_INSECURE" = "true" ]; then
            node microservices/reservation-service/scripts/post-sale-smoke.cjs "$RESERVATION_TARGET" --insecure
          else
            node microservices/reservation-service/scripts/post-sale-smoke.cjs "$RESERVATION_TARGET"
          fi
