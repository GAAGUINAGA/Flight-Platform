name: Deploy GraphQL service

# Servicio GraphQL del front (F12c-1): HTTP/1.1 (no gRPC), sin base de datos. No usa deploy-service.yml (que despliega con --use-http2).
# Despliegue solo desde main, tras la auditoría de código. Las variables de configuración (GATEWAY_BASE_URL, JWT_ISSUERS, CORS_ORIGINS)
# se configuran a mano en Cloud Run (docs/dev/f12c1-graphql-despliegue.md) y este workflow NO las borra: usa --update-env-vars.
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-graphql.yml'
      - 'platform/graphql/**'
      - 'packages/graphql-schema/**'
      - 'scripts/ci/graphql-image-smoke.sh'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-graphql.yml'
      - 'platform/graphql/**'
      - 'packages/graphql-schema/**'
      - 'scripts/ci/graphql-image-smoke.sh'
      - 'package-lock.json'
      - 'tsconfig.base.json'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-a1d2e3ba-f6ff-469e-854
  REGION: us-east1
  CLOUD_RUN_SERVICE: graphql-service
  IMAGE: us-east1-docker.pkg.dev/project-a1d2e3ba-f6ff-469e-854/flight-platform/graphql-service:${{ github.sha }}
  RUNTIME_SERVICE_ACCOUNT: graphql-service-runtime@project-a1d2e3ba-f6ff-469e-854.iam.gserviceaccount.com

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build -w @flight-platform/graphql
      - run: npx jest platform/graphql --runInBand
      - run: npm audit --audit-level=high
      - run: npm run audit:policy
      # La imagen debe arrancar con NODE_ENV=production y responder SERVING en /health con PORT=8080.
      - name: Humo del contenedor
        run: sh scripts/ci/graphql-image-smoke.sh graphql-service-smoke
      - uses: google-github-actions/auth@v2
        if: github.ref == 'refs/heads/main'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: github.ref == 'refs/heads/main'
      - name: Build and deploy
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f platform/graphql/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --image "${IMAGE}" --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --update-env-vars "NODE_ENV=production" \
            --allow-unauthenticated --port 8080 --min-instances 0 --quiet
