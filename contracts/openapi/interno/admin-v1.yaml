openapi: 3.0.3
info:
  title: API interna de administración de GabatAIR — versión 1
  version: 1.0.0
  description: |
    **API interna de administración, versión 1.** Es de uso exclusivo del panel de administración de GabatAIR.
    **No forma parte del contrato público** con Booking y **no tiene relación con el contrato `v1` (`/flights/v1`), que está deprecado**:
    aquí «v1» es solo la primera versión de esta API interna.

    - Solo el rol `admin` con el scope `flights:admin` (JWT de Supabase). Un `customer`, un `partner` o una petición sin token no entran.
    - Errores con el formato `ProblemDetails` de la API v2 (RFC 7807).
    - Los manejadores son los de las antiguas rutas de administración; no hay lógica nueva salvo `GET /web-bookings`.
    - Fechas y horas de vuelo en ISO-8601 con desplazamiento; `date` es la fecha local del aeropuerto de origen (ADR-F12b1fix-02).

    **Registro de cambios** (la versión de la API interna sigue siendo `v1`: es interna, sin consumidores en producción fuera de la entrega F12c-1; el único es el servicio GraphQL).
    - 2026-11-12 (F12c-1, audit-25 H1; adenda al ADR-F12c-02): `GET /web-bookings` — el parámetro `before` y la propiedad `nextCursor` pasan de `string` con `format: date-time` a **texto opaco**
      (`type: string`, sin `format`, `maxLength: 200`). Motivo: la lista se ordena por fecha de creación **y** `bookingId` (desempate) y un cursor que solo fuera una fecha repetía o saltaba reservas
      con la misma fecha de creación en el borde de la página. El cliente no debe interpretarlo ni formatearlo, solo devolver el `nextCursor` recibido. Un `before` mal formado o alterado responde `400 VALIDATION_FAILED`.
      Cambio incompatible solo para quien tratara el cursor como fecha: se declara aquí por no haberse declarado en la entrega original.
    - 2026-11-15 (F12c-4a; ADR-F12c4-01): se **agrega** `POST /bookings/search` (búsqueda de solo lectura de una reserva por PNR, de cualquier canal, sin datos personales; cada intento queda registrado) y
      los esquemas `AdminBookingSearch` y `AdminBookingView`. Solo agregados: nada existente cambia.
    - 2026-11-15 (F12c-4a, audit-39 H3; adenda al ADR-F12c4-01): `POST /bookings/search` deja de declarar `400` por «solicitud inválida» y declara el comportamiento real: un cuerpo inválido
      (ausente, ilegible, que no es objeto, sin `pnr`, de otro tipo, vacío, largo o con campos de más) responde `404 NOT_FOUND`, indistinguible de un PNR inexistente o ajeno, y se registra.
      El único `400` posible es el de la comprobación de transporte (sin HTTPS). Se define «intento» en la descripción de la ruta. Esta ruta no valida el cuerpo contra este documento (lo valida el punto único de la búsqueda).
    - 2026-11-15 (F12c-4a, audit-40 H1; decisión del humano, PLAN §4.4 regla 4; adenda al ADR-F12c4-01): solo documentación, sin cambio de comportamiento. El orden dentro del punto único es leer el cuerpo → **límite** → validar → buscar
      (antes se decía validar → límite). Con el límite alcanzado, cualquier intento, también uno con cuerpo inválido, recibe `429` con `Retry-After` y se registra `RATE_LIMITED`; el `404` por cuerpo inválido solo aplica si no se alcanzó el límite.
servers:
  - url: /api/admin/v1
    description: Gateway (misma URL base que el resto de la plataforma)
security:
  - BearerAuth: []
paths:
  /flights:
    get:
      operationId: listAdminFlights
      summary: Listar vuelos (con flightInstanceId)
      parameters:
        - name: date
          in: query
          required: false
          description: Fecha local del aeropuerto de origen (AAAA-MM-DD).
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de vuelos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFlightList' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /fares:
    get:
      operationId: listAdminFares
      summary: Leer tarifas (de un vuelo o todas)
      parameters:
        - name: flightInstanceId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tarifas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFareList' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    put:
      operationId: upsertAdminFare
      summary: Guardar una tarifa (la clave natural vuelo + cabina + marca actualiza y conserva fareId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminFareInput' }
      responses:
        '200':
          description: Tarifa guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFareResponse' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /web-bookings:
    get:
      operationId: listWebTestBookings
      summary: Reservas del canal WEB (pago simulado), marcadas como de prueba
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: before
          in: query
          required: false
          description: Cursor opaco devuelto en `nextCursor`; no interpretar. Uno mal formado o alterado responde 400 VALIDATION_FAILED.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Reservas de prueba de la web, de la más reciente a la más antigua
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebTestBookingList' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /bookings/search:
    post:
      operationId: searchAdminBookingByPnr
      summary: Buscar una reserva por PNR (solo lectura, cualquier canal)
      description: |
        Devuelve la reserva SIN documentos de identidad, correos, teléfonos, referencias de pago ni el identificador del socio (solo un hash opaco).
        Cada búsqueda queda registrada (quién, qué PNR, cuándo y el resultado: encontrada o no), sin guardar los datos de la reserva.
        Un PNR inexistente, ajeno o mal formado, o un cuerpo inválido, responde igual: `404 NOT_FOUND`, salvo que el administrador haya alcanzado su límite, en cuyo caso responde `429 RATE_LIMIT_EXCEEDED`. Límite por administrador y hora (`ADMIN_PNR_SEARCH_LIMIT_PER_HOUR`, 30 por omisión).
        Es POST (con cuerpo) para que el PNR no viaje en la URL ni en los registros de proxy.

        **Intento.** Un intento es un pedido de un administrador autenticado que pasó las comprobaciones de transporte (HTTPS). Orden obligatorio: transporte → autenticación → rol →
        punto único (leer el cuerpo → LÍMITE → validar → buscar). Todo lo que ocurre dentro del punto único se registra en `gateway.admin_access_log`, una fila por intento, antes de responder.
        Lo que se rechaza ANTES del punto único (sin HTTPS, sin sesión, sesión inválida o usuario que no es administrador) NO va a ese registro: no hay un administrador al que atribuirlo y aceptarlo
        permitiría que cualquiera llene una tabla de solo inserción; queda en los registros normales del gateway con su `correlationId`. El cuerpo se lee solo después de la autenticación y del rol.
        **Precedencia del límite:** cuando el administrador alcanzó su límite, cualquier intento (incluido uno con el cuerpo inválido) recibe `429` con `Retry-After` y queda registrado como `RATE_LIMITED`; el `429` tiene
        precedencia sobre el `404` de un cuerpo inválido. Razón: quien agotó su cupo queda bloqueado para todo, sin que el gateway procese lo que envía.

        Respuestas: `200` encontrada; `404` no encontrada, ajena o cuerpo inválido (indistinguibles), salvo que se haya alcanzado el límite, en cuyo caso `429`; `401` sin sesión o inválida; `403` no es administrador;
        `429` límite superado (con `Retry-After`, tiene precedencia sobre el `404` por cuerpo inválido); `503` dependencia o registro no disponible. `400` solo lo produce la comprobación de transporte (sin HTTPS, `X-Forwarded-Proto: http`), nunca el cuerpo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBookingSearch' }
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingView' }
        '400': { $ref: '#/components/responses/ProblemTransport400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '503': { $ref: '#/components/responses/Problem503' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Supabase con `app_role = admin` y el scope `flights:admin`.
  responses:
    Problem400:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ProblemTransport400:
      description: Solo la comprobación de transporte (sin HTTPS, `X-Forwarded-Proto` http); nunca por el cuerpo
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem401:
      description: No autenticado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem403:
      description: Rol o scope insuficiente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem404:
      description: No encontrada (mismo cuerpo para un PNR inexistente, ajeno, mal formado o un cuerpo inválido; si se alcanzó el límite, la respuesta es 429)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem429:
      description: Límite de búsquedas por administrador superado (con la cabecera `Retry-After` de 60 segundos); tiene precedencia sobre el 404 de un cuerpo inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem503:
      description: Dependencia o registro de auditoría no disponible (con `Retry-After`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, RATE_LIMIT_EXCEEDED, INTERNAL_ERROR, PROVIDER_UNAVAILABLE]
        correlation_id: { type: string }
        timestamp: { type: string, format: date-time }
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
    CabinClass:
      type: string
      enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST]
    Page:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
    CabinCapacity:
      type: object
      required: [cabinClass, capacity]
      properties:
        cabinClass: { $ref: '#/components/schemas/CabinClass' }
        capacity: { type: integer, minimum: 0 }
    FlightEndpoint:
      type: object
      properties:
        iataCode: { type: string, pattern: '^[A-Z]{3}$' }
        at: { type: string, format: date-time }
        terminal: { type: string, nullable: true }
    AdminFlight:
      type: object
      required: [flightInstanceId, segment, cabins, closed]
      properties:
        flightInstanceId: { type: string, format: uuid }
        segment:
          type: object
          properties:
            flightNumber: { type: string }
            departure: { $ref: '#/components/schemas/FlightEndpoint' }
            arrival: { $ref: '#/components/schemas/FlightEndpoint' }
            aircraft: { type: string, nullable: true }
        cabins:
          type: array
          items: { $ref: '#/components/schemas/CabinCapacity' }
        closed: { type: boolean }
    AdminFlightList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminFlight' }
        page: { $ref: '#/components/schemas/Page' }
    Money:
      type: object
      additionalProperties: false
      required: [currency, total]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        baseFare: { type: string, pattern: '^\d+\.\d{2}$' }
        taxes: { type: string, pattern: '^\d+\.\d{2}$' }
        total: { type: string, pattern: '^\d+\.\d{2}$' }
    AdminFareInput:
      type: object
      additionalProperties: false
      required: [flightInstanceId, cabinClass, fareBrand, price, fareRules, baggageAllowance, extraCheckedBaggagePrice]
      properties:
        fareId: { type: string, format: uuid }
        flightInstanceId: { type: string, format: uuid }
        cabinClass: { $ref: '#/components/schemas/CabinClass' }
        fareBrand: { type: string, minLength: 1, maxLength: 32 }
        price: { $ref: '#/components/schemas/Money' }
        fareRules:
          type: object
          additionalProperties: false
          required: [isRefundable, isChangeable]
          properties:
            isRefundable: { type: boolean }
            isChangeable: { type: boolean }
        baggageAllowance:
          type: object
          additionalProperties: false
          properties:
            personalItemIncluded: { type: boolean }
            carryOnIncluded: { type: integer, minimum: 0, maximum: 9 }
            checkedBaggageIncluded: { type: integer, minimum: 0, maximum: 9 }
        extraCheckedBaggagePrice: { $ref: '#/components/schemas/Money' }
    AdminFare:
      type: object
      required: [fareId, flightInstanceId, cabinClass, fareBrand, price]
      properties:
        fareId: { type: string, format: uuid }
        flightInstanceId: { type: string, format: uuid }
        cabinClass: { $ref: '#/components/schemas/CabinClass' }
        fareBrand: { type: string }
        price: { type: object }
        fareRules: { type: object }
        baggageAllowance: { type: object }
        extraCheckedBaggagePrice: { type: object }
    AdminFareResponse:
      type: object
      required: [fare]
      properties:
        fare: { $ref: '#/components/schemas/AdminFare' }
    AdminFareList:
      type: object
      required: [fares]
      properties:
        fares:
          type: array
          items: { $ref: '#/components/schemas/AdminFareResponse' }
        page: { $ref: '#/components/schemas/Page' }
    WebTestBooking:
      type: object
      required: [bookingId, createdAt, channel, test, passengers]
      properties:
        bookingId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        channel: { type: string, enum: [WEB] }
        test: { type: boolean, enum: [true], description: 'Siempre true: pago simulado, sin cobro.' }
        passengers: { type: integer, minimum: 0 }
        owner: { type: string, description: 'Referencia opaca del usuario (hash); nunca el sub ni datos personales.' }
    WebTestBookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebTestBooking' }
        nextCursor: { type: string, nullable: true, minLength: 1, maxLength: 200, description: Cursor opaco devuelto para `before`; no interpretar. null en la última página. }
    AdminBookingSearch:
      type: object
      additionalProperties: false
      required: [pnr]
      properties:
        pnr: { type: string, description: "Localizador de 6 caracteres (se normaliza a mayúsculas). Cualquier otro texto (también vacío o muy largo) responde 404, igual que uno inexistente, y queda registrado como INVALID_FORMAT sin guardar el texto." }
    AdminBookingView:
      type: object
      additionalProperties: false
      required: [bookingId, pnr, status, channel, createdAt, grandTotal, segments, passengers, tickets, checkIn]
      description: Lista blanca. NO incluye documentos, correos, teléfonos, referencias de pago, dueño ni identificador de socio.
      properties:
        bookingId: { type: string, format: uuid }
        pnr: { type: string }
        status: { type: string }
        channel: { type: string, enum: [WEB, PARTNER] }
        partnerRef: { type: string, description: "Solo canal PARTNER: hash opaco del socio (12 hex), nunca su identificador." }
        createdAt: { type: string }
        grandTotal:
          type: object
          additionalProperties: false
          required: [currency, total]
          properties:
            currency: { type: string }
            total: { type: string }
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [segmentId, flightNumber, origin, destination, departureAt, arrivalAt, departureLocal, arrivalLocal]
            properties:
              segmentId: { type: string }
              flightNumber: { type: string }
              origin: { type: string }
              destination: { type: string }
              departureAt: { type: string, description: UTC }
              arrivalAt: { type: string, description: UTC }
              departureLocal: { type: string, description: "Hora local del aeropuerto de salida (AAAA-MM-DDTHH:mm)" }
              arrivalLocal: { type: string, description: "Hora local del aeropuerto de llegada (AAAA-MM-DDTHH:mm)" }
              status: { type: string }
              cabinClass: { type: string }
        passengers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [passengerId, passengerType, firstName, lastName, seats, extraBaggage]
            properties:
              passengerId: { type: string }
              passengerType: { type: string }
              firstName: { type: string }
              lastName: { type: string }
              seats:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [segmentId, seatNumber]
                  properties:
                    segmentId: { type: string }
                    seatNumber: { type: string }
                    status: { type: string }
              extraBaggage:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [itineraryId, quantity]
                  properties:
                    itineraryId: { type: string }
                    quantity: { type: integer }
        tickets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [passengerId, status, segments]
            properties:
              passengerId: { type: string }
              status: { type: string }
              eTicketLast4: { type: string, description: Últimos 4 dígitos del boleto. }
              segments:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [segmentId, status]
                  properties:
                    segmentId: { type: string }
                    status: { type: string }
        checkIn:
          type: object
          additionalProperties: false
          required: [status, passengers]
          properties:
            status: { type: string, description: "NOT_STARTED, IN_PROGRESS, COMPLETED o FAILED" }
            passengers:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [passengerId, status, segments]
                properties:
                  passengerId: { type: string }
                  status: { type: string }
                  segments:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [segmentId, status]
                      properties:
                        segmentId: { type: string }
                        status: { type: string }
                        seat: { type: string }
