syntax = "proto3";
package flightplatform.reservation.v1;
import "flightplatform/common/v1/common.proto";

service ReservationService {
  rpc CreateReservation(CreateReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  rpc GetReservation(GetReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  rpc GetReservationSnapshot(GetReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  rpc ListReservationsByFlightInstance(ListReservationsByFlightInstanceRequest) returns (ListReservationsByFlightInstanceResponse);
  rpc GetBaggageOptions(GetReservationRequest) returns (BaggageOptionsResponse);
  rpc AddBaggage(AddBaggageRequest) returns (BaggageAddedResponse);
  rpc SearchDateChange(SearchDateChangeRequest) returns (DateChangeSearchResponse);
  rpc ConfirmDateChange(ConfirmDateChangeRequest) returns (flightplatform.common.v1.BookingDetail);
  rpc GetCancellationQuote(GetReservationRequest) returns (flightplatform.common.v1.CancellationQuote);
  rpc CancelReservation(CancelReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  rpc ResumePending(ResumePendingRequest) returns (ResumePendingResponse);
  // Aditivo F12a (D3): payment.failed de Booking. Anula boletos, libera asientos y capacidad y marca FAILED; idempotente.
  rpc FailReservation(FailReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  // Aditivo F12a: reintenta de inmediato la reserva indicada (p. ej. payment.confirmed de una reserva en PENDING_PAYMENT o TICKET_ISSUING).
  rpc ResumeReservation(GetReservationRequest) returns (flightplatform.common.v1.BookingDetail);
  // Aditivo F12a (D5): cotización con la penalidad exenta (SAGA_COMPENSATION dentro de la ventana, FLIGHT_CANCELLED).
  rpc QuoteCancellation(QuoteCancellationRequest) returns (flightplatform.common.v1.CancellationQuote);
  // Aditivo F12a: lee una cotización ya emitida (también vencida o usada) para informar el reembolso de POST cancel.
  rpc GetStoredCancellationQuote(StoredQuoteRequest) returns (flightplatform.common.v1.CancellationQuote);
}
message QuoteCancellationRequest { string booking_id = 1; string owner_id = 2; optional bool waive_penalty = 3; }
message StoredQuoteRequest { string booking_id = 1; string owner_id = 2; string quote_id = 3; }

message CreateReservationRequest {
  string owner_id = 1;
  string hold_id = 2;
  repeated flightplatform.common.v1.Passenger passengers = 3;
  flightplatform.common.v1.PaymentReference payment = 4;
  string idempotency_key = 5;
  // Aditivo F12a: canal de verificación de pago ("BOOKING" consulta la API de pagos de Booking). Ausente = verificador v1.
  optional string payment_channel = 6;
  // Aditivo F12a: si Ticketing falla tras consumir el hold, devuelve la reserva en TICKET_ISSUING (a reintentar) en lugar de error.
  optional bool defer_issuance_failure = 7;
}
message FailReservationRequest { string booking_id = 1; string owner_id = 2; optional string reason = 3; }
message GetReservationRequest { string booking_id = 1; string owner_id = 2; }
message ListReservationsRequest {
  string owner_id = 1;
  optional string pnr = 2;
  flightplatform.common.v1.PageRequest page = 3;
  // Aditivo F12a: filtros de GET /vuelos/bookings (fechas ISO 8601; el estado usa el nombre interno).
  optional string status = 4;
  optional string created_from = 5;
  optional string created_to = 6;
}
message ListReservationsResponse {
  repeated flightplatform.common.v1.BookingSummary items = 1;
  optional string next_cursor = 2;
}
message ListReservationsByFlightInstanceRequest {
  string flight_instance_id = 1;
  optional uint32 limit = 2;
  optional string cursor = 3;
}
// Campos 1-7 idénticos a common.v1.BookingSummary (compatible en el cable); owner_id es aditivo.
message FlightReservationSummary {
  string booking_id = 1;
  string pnr = 2;
  string status = 3;
  string origin = 4;
  string destination = 5;
  string departure_date = 6;
  flightplatform.common.v1.MoneyAmount grand_total = 7;
  string owner_id = 8;
}
message ListReservationsByFlightInstanceResponse {
  repeated FlightReservationSummary items = 1;
  optional string next_cursor = 2;
}
message BaggageOptionsResponse { repeated flightplatform.common.v1.BaggageOption options = 1; }
message AddBaggageRequest {
  string booking_id = 1;
  string owner_id = 2;
  string passenger_id = 3;
  string itinerary_id = 4;
  uint32 quantity = 5;
  flightplatform.common.v1.PaymentReference payment = 6;
  string idempotency_key = 7;
  optional string payment_channel = 8;
}
message BaggageAddedResponse { string passenger_id = 1; string itinerary_id = 2; uint32 total_baggage = 3; }
message DateChangeSelection { string itinerary_id = 1; string new_departure_date = 2; }
message SearchDateChangeRequest {
  string booking_id = 1;
  string owner_id = 2;
  repeated DateChangeSelection changes = 3;
}
message DateChangeSearchResponse { repeated flightplatform.common.v1.DateChangeOffer offers = 1; }
message ConfirmDateChangeRequest {
  string booking_id = 1;
  string owner_id = 2;
  string change_offer_id = 3;
  optional flightplatform.common.v1.PaymentReference payment = 4;
  repeated flightplatform.common.v1.AssignedSeat assigned_seats = 5;
  string idempotency_key = 6;
  optional string payment_channel = 7;
}
message CancelReservationRequest {
  string booking_id = 1;
  string owner_id = 2;
  string quote_id = 3;
  optional string reason = 4;
  string idempotency_key = 5;
  // Aditivo F12a: CUSTOMER_REQUEST, SAGA_COMPENSATION, FLIGHT_CANCELLED u OTHER (viaja en el evento booking.cancelled de v2).
  optional string reason_code = 6;
}
message ResumePendingRequest { uint32 limit = 1; }
message ResumePendingResponse { uint32 resumed_count = 1; }
